<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高保真状态原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-canvas:#f7f7f4;--bg-soft:#fafaf7;--bg-card:#fff;--bg-workspace:#ecebe5;--bg-hover:#efeee8;--bg-pressed:#e6e5e0;
  --line:#e6e5e0;--line-strong:#cfcdc4;--ink:#26251e;--body:#5a5852;--mute:#6b6960;--decor:#807d72;--dis:#a09c92;
  --sel-bg:#26251e;--sel-fg:#f7f7f4;--brand:#f54e00;--primary:#d04200;--primary-hover:#bf3d00;--primary-pressed:#b33900;
  --secure:#1f8a65;--error:#cf2d56;--warn:#ffc533;--scrim:rgba(38,37,30,.55);
  --pill-secure:#9fc9a2;--pill-busy:#dfa88f;--pill-done:#c08532;--pill-info:#9fbbe0;
  --red:#e5342b;--yellow:#ffc60a;--green:#22a652;--blue:#2f6ff0;--black:#1a1915;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:#e9e8e2;color:var(--body);font:13px/20px Inter,"Noto Sans SC",system-ui,sans-serif}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:var(--bg-canvas);border-right:1px solid var(--line-strong);padding:16px;overflow:auto;max-height:100vh;position:sticky;top:0}
aside h1{font-size:20px;line-height:26px;font-weight:400;letter-spacing:-.3px;color:var(--ink);margin:0 0 4px}
aside p{margin:0 0 14px;color:var(--mute);font-size:12px}
aside h2{font-size:11px;font-weight:600;letter-spacing:.6px;color:var(--mute);margin:14px 0 6px}
.list button{display:flex;width:100%;text-align:left;gap:8px;align-items:center;border:0;background:transparent;padding:5px 8px;border-radius:6px;font:inherit;color:var(--body);cursor:pointer}
.list button:hover{background:var(--bg-hover)}
.list button.on{background:var(--sel-bg);color:var(--sel-fg)}
.list button .id{font:11px/16px var(--mono);opacity:.7;width:28px}
.sizes{display:flex;gap:4px;flex-wrap:wrap}
.sizes button{border:1px solid var(--line-strong);background:var(--bg-card);border-radius:8px;padding:4px 8px;font:12px var(--mono);color:var(--ink);cursor:pointer}
.sizes button.on{background:var(--sel-bg);color:var(--sel-fg);border-color:transparent}
main{padding:24px;overflow:hidden}
.note{max-width:900px;margin:0 0 12px;color:var(--mute);font-size:12px}
.note b{color:var(--ink);font-weight:500}
.stagewrap{position:relative}
.stage{transform-origin:top left}
/* window */
.win{border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--bg-workspace);display:flex;flex-direction:column;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.titlebar{height:32px;flex:none;background:var(--bg-canvas);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line)}
.toolbar{height:52px;flex:none;background:var(--bg-canvas);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 10px;gap:4px;min-width:0}
.mark{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:500;margin-right:8px;white-space:nowrap}
.mark i{width:12px;height:12px;background:var(--brand);border-radius:3px;display:block;flex:none}
.ib{width:32px;height:32px;flex:none;border-radius:6px;display:grid;place-items:center;color:var(--body);position:relative}
.ib:hover{background:var(--bg-hover)}
.ib.on{background:var(--sel-bg);color:var(--sel-fg)}
.ib.dis{color:var(--dis)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ib .badge{position:absolute;right:3px;bottom:3px;width:8px;height:9px;fill:var(--secure);stroke:none}
.ib.on .badge{fill:#5fd3a6}
.vsep{width:1px;height:22px;flex:none;background:var(--line-strong);margin:0 6px}
.grow{flex:1;min-width:0}
.btn{height:32px;flex:none;border-radius:8px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;font:500 13px/16px Inter,"Noto Sans SC",sans-serif;color:var(--ink);border:1px solid var(--line-strong);background:var(--bg-card);white-space:nowrap}
.btn.primary{background:var(--primary);color:#fff;border-color:transparent}
.btn.danger{background:transparent;border-color:transparent;color:var(--error)}
.btn.dis{color:var(--dis);background:var(--bg-pressed);border-color:transparent}
.btn.small{height:26px;padding:0 10px;font-size:12px}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5}
.kc{height:18px;padding:0 5px;border-radius:4px;border:1px solid var(--line-strong);border-bottom-width:2px;background:var(--bg-card);font:500 11px/14px var(--mono);color:var(--mute);display:inline-flex;align-items:center;white-space:nowrap}
.btn.primary .kc{background:rgba(255,255,255,.18);border:0;color:#fff}
.btn.dis .kc{opacity:.5}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp 0.8s linear infinite}
.spin.dark{border-color:rgba(38,37,30,.15);border-top-color:var(--decor);width:20px;height:20px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.propbar{height:40px;flex:none;background:var(--bg-soft);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 12px;font-size:12px;color:var(--mute);overflow-x:auto;white-space:nowrap}
.propbar{overflow:hidden}.propbar .pscroll{display:flex;align-items:center;gap:12px;overflow-x:auto;min-width:0;flex:1}.propbar .pscroll::-webkit-scrollbar{height:0}.propbar .tail{display:flex;gap:8px;flex:none;padding-left:8px;background:linear-gradient(90deg,transparent,var(--bg-soft) 8px)}
.sw{width:20px;height:20px;border-radius:6px;display:inline-block;flex:none}
.sw.w{box-shadow:inset 0 0 0 1px var(--line-strong)}
.sw.sel{box-shadow:0 0 0 2px var(--bg-soft),0 0 0 4px var(--ink)}
.sws{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;height:28px;flex:none;border-radius:8px;background:var(--bg-pressed);padding:2px;gap:2px}
.seg span{padding:0 10px;border-radius:6px;display:flex;align-items:center;color:var(--body);font-size:12px}
.seg span.on{background:var(--bg-card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-strong)}
.num{height:28px;min-width:48px;padding:0 8px;border-radius:8px;border:1px solid var(--line-strong);background:var(--bg-card);color:var(--ink);display:inline-flex;align-items:center;font:12px/16px var(--mono)}
.num.focus{border-color:var(--brand)}
.canvas{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;position:relative}
.status{height:30px;flex:none;background:var(--bg-canvas);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 12px;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden}
.mono{font-family:var(--mono)}
.pill{height:20px;border-radius:999px;padding:0 8px;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ink);white-space:nowrap;flex:none}
.pill svg{width:10px;height:11px}
.pill.secure{background:var(--pill-secure)}.pill.busy{background:var(--pill-busy)}.pill.done{background:var(--pill-done)}.pill.info{background:var(--pill-info)}
.zoom{display:flex;align-items:center;gap:2px}
.zoom .z{height:22px;padding:0 8px;border-radius:6px;display:flex;align-items:center;gap:6px}
.zoom .z.on{color:var(--ink);background:var(--bg-pressed)}
/* shot + overlays (percent of 620x430) */
.shot{position:relative;outline:1px solid var(--line-strong);background:#f3f5f8}
.shot img{display:block;width:100%;height:100%;image-rendering:auto}
.ov{position:absolute}
.o-solid{background:var(--black)}
.o-mosaic{background:conic-gradient(#4b4a44 25%,#5d5b54 0 50%,#3a3934 0 75%,#6f6d65 0) 0 0/12px 12px}
.o-dash{outline:1px dashed var(--secure)}
.o-shield{width:14px;height:14px;margin:-7px 0 0 -7px;background:var(--secure);border-radius:3px;display:grid;place-items:center}
.o-shield svg{width:9px;height:9px;fill:#fff}
.o-sel{outline:1px solid var(--sel-bg);box-shadow:0 0 0 2px #fff}
.o-sel i{position:absolute;width:8px;height:8px;background:#fff;border:1.5px solid var(--sel-bg);border-radius:2px;margin:-4px 0 0 -4px}
.o-multi{background:rgba(38,37,30,.08);outline:1px solid var(--sel-bg)}
.o-rect{border:3px solid var(--red);border-radius:2px}
.o-draft{border:3px solid var(--red);border-radius:2px;opacity:.85}
.o-num{width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--red);color:#fff;font:600 14px/26px Inter,sans-serif;text-align:center}
.o-text{color:var(--red);font:600 18px/24px Inter,"Noto Sans SC",sans-serif;white-space:nowrap}
.o-textedit{outline:1px dashed var(--sel-bg);outline-offset:3px}
.caret{display:inline-block;width:1.5px;height:20px;background:var(--ink);vertical-align:-4px;margin-left:1px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.ime{position:absolute;background:var(--bg-card);border:1px solid var(--line-strong);border-radius:8px;padding:4px 8px;font-size:13px;color:var(--ink);white-space:nowrap}
.ime b{color:var(--brand);font-weight:500}
.dimlabel{position:absolute;background:var(--sel-bg);color:var(--sel-fg);font:11px/16px var(--mono);padding:1px 6px;border-radius:4px;white-space:nowrap}
.crop-dark{position:absolute;background:var(--scrim)}
.crop-box{position:absolute;outline:1px solid #fff}
.crop-box::before,.crop-box::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 33.2%,rgba(255,255,255,.5) 33.3% 33.5%,transparent 33.6% 66.5%,rgba(255,255,255,.5) 66.6% 66.8%,transparent 66.9%)}
.crop-box::after{background:linear-gradient(180deg,transparent 33.2%,rgba(255,255,255,.5) 33.3% 33.5%,transparent 33.6% 66.5%,rgba(255,255,255,.5) 66.6% 66.8%,transparent 66.9%)}
.crop-box i{position:absolute;width:8px;height:8px;background:#fff;border:1.5px solid var(--sel-bg);border-radius:2px;margin:-4px 0 0 -4px;z-index:1}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:rgba(236,235,229,.6)}
.loading div{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--mute);font-size:12px}
/* toast */
.toast{position:absolute;right:16px;bottom:16px;min-width:260px;max-width:calc(100% - 32px);background:var(--bg-card);border:1px solid var(--line-strong);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;z-index:5}
.toast b{color:var(--ink);font-weight:500;display:block}
.toast small{display:block;color:var(--mute);font-size:12px;line-height:16px}
.toast .ic{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font:600 12px/1 Inter}
.toast .ic.err{background:var(--error)}.toast .ic.warn{background:var(--warn);color:var(--ink)}
.desk{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line-strong);background:linear-gradient(135deg,#4d5c6f,#2c3440)}
.desk .note2{position:absolute;left:16px;top:12px;color:#fff;font-size:12px;opacity:.8}
/* dialog */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:6}
.dialog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(400px,calc(100% - 32px));background:var(--bg-card);border:1px solid var(--line-strong);border-radius:12px;padding:24px;z-index:7}
.dialog h3{margin:0 0 6px;font-size:15px;line-height:22px;color:var(--ink);font-weight:600}
.dialog p{margin:0;color:var(--body)}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;flex-wrap:wrap}
.about .slint{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px}
.about .slint i{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,#2379f4,#7ab8ff);display:block}
.about dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 0 0;font-size:12px}
.about dt{color:var(--mute)}.about dd{margin:0;color:var(--ink)}
/* empty */
.empty{position:absolute;inset:0;display:grid;place-content:center;gap:22px;text-align:center;background:var(--bg-canvas);padding:16px}
.empty h2{margin:0;font-size:26px;line-height:32px;font-weight:400;letter-spacing:-.4px;color:var(--ink)}
.cards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.card{width:150px;height:116px;border-radius:12px;background:var(--bg-card);border:1px solid var(--line-strong);display:grid;place-content:center;gap:6px;justify-items:center;color:var(--ink);font-weight:500;position:relative}
.card.first::before{content:"";position:absolute;left:10px;top:10px;width:8px;height:8px;border-radius:2px;background:var(--brand)}
.card svg{width:24px;height:24px;stroke:var(--body);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.drop{border:1px dashed var(--line-strong);border-radius:12px;padding:14px;color:var(--mute);font-size:12px}
.drop.hover{border:1.5px solid var(--brand);background:rgba(245,78,0,.06);color:var(--ink)}
.compact .card{width:120px;height:96px}
/* capture overlay */
.cap{position:absolute;inset:0}
.cap .dim{position:absolute;background:var(--scrim)}
.cap .selr{position:absolute;outline:1px solid #fff;box-shadow:0 0 0 2px var(--sel-bg)}
.cap .selr i{position:absolute;width:8px;height:8px;background:#fff;border:1.5px solid var(--sel-bg);border-radius:2px;margin:-4px 0 0 -4px}
.cap .lab{position:absolute;background:var(--bg-card);border:1px solid var(--line-strong);border-radius:6px;padding:1px 6px;font:11px/16px var(--mono);color:var(--ink)}
.cap .mag{position:absolute;width:120px;height:120px;border-radius:12px;border:1px solid var(--line-strong);background:#f3f5f8 repeating-linear-gradient(0deg,#e3e6ea 0 10px,#f3f5f8 10px 20px);overflow:hidden}
.cap .mag::before,.cap .mag::after{content:"";position:absolute;background:var(--brand)}
.cap .mag::before{left:59px;top:0;bottom:24px;width:1px}.cap .mag::after{top:48px;left:0;right:0;height:1px}
.cap .mag span{position:absolute;left:0;right:0;bottom:0;height:24px;background:var(--bg-card);border-top:1px solid var(--line);font:11px/24px var(--mono);text-align:center;color:var(--ink)}
.cap .hint{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);background:var(--bg-card);border:1px solid var(--line-strong);border-radius:10px;padding:6px 12px;font-size:12px;color:var(--ink);display:flex;gap:10px;align-items:center;white-space:nowrap}
.fakewin{position:absolute;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.fakewin header{height:28px;background:#f0f0f0;border-bottom:1px solid #ddd;font-size:11px;color:#555;display:flex;align-items:center;padding:0 10px}
.fakewin img{width:100%;display:block}
.snap{position:absolute;outline:1px solid #fff;box-shadow:0 0 0 2px var(--sel-bg)}
/* tray */
.taskbar{position:absolute;left:0;right:0;bottom:0;height:40px;background:#1f2329;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;gap:12px;color:#ddd;font-size:12px}
.trayicon{width:18px;height:18px;border-radius:4px;background:var(--brand);outline:2px solid rgba(255,255,255,.35)}
.menu{position:absolute;right:60px;bottom:48px;width:220px;background:var(--bg-card);border:1px solid var(--line-strong);border-radius:12px;padding:4px}
.menu div{height:30px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:var(--ink)}
.menu div.hv{background:var(--bg-hover)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line-strong)}main{padding:16px}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>高保真状态原型</h1>
    <p>05_HIGH_FIDELITY v0.1 · 奶油编辑台 · DESIGN v1.0。HTML 仅为视觉与交互参考；原生实现为 Slint。</p>
    <h2>窗口尺寸</h2>
    <div class="sizes" id="sizes"></div>
    <h2>状态</h2>
    <div class="list" id="list"></div>
  </aside>
  <main>
    <p class="note" id="note"></p>
    <div class="stagewrap" id="wrap"><div class="stage" id="stage"></div></div>
  </main>
</div>

  select:'<path d="M4 4l7 17 2.5-7.5L21 11z"/>', arrow:'<path d="M5 19L19 5M9 5h10v10"/>', rect:'<rect x="4" y="5" width="16" height="14" rx="1"/>',
  text:'<path d="M5 6V4h14v2M12 4v16M9 20h6"/>', num:'<circle cx="12" cy="12" r="8"/><path d="M11 9l1.5-1V16"/>',
  hl:'<path d="M9 11l-5 5v4h4l5-5M14 6l4 4M9 11l5-5 4 4-5 5z"/>', shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
  mosaic:'<path d="M4 4h7v7H4zM13 13h7v7h-7z"/><path d="M13 4h7v7h-7zM4 13h7v7H4z" opacity=".45"/>', crop:'<path d="M6 2v16h16M2 6h16v16"/>',
  undo:'<path d="M9 14L4 9l5-5M4 9h11a5 5 0 010 10h-3"/>', redo:'<path d="M15 14l5-5-5-5M20 9H9a5 5 0 000 10h3"/>',
  save:'<path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/>'
};
const SHIELD_SMALL='<svg viewBox="0 0 8 9"><path fill="currentColor" d="M4 0l4 1.5v3C8 7 6 8.5 4 9 2 8.5 0 7 0 4.5v-3z"/></svg>';
const svg = k => `<svg viewBox="0 0 24 24">${ICON[k]}</svg>`;
const SIZES = [[1440,900,'1440×900'],[1024,768,'1024×768'],[640,420,'640×420 最小']];
const STATES = [
  ['H01','空状态'],['H02','拖入悬停'],['H03','加载中'],['H04','编辑空闲'],['H05','创建中'],['H06','选中遮挡'],['H07','多选'],
  ['H08','文字编辑'],['H09','裁剪'],['H10','复制中'],['H11','复制成功'],['H12','复制失败'],['H13','保存成功'],['H14','保存失败'],
  ['H15','交付作废'],['H16','关闭确认'],['H17','截图·吸附窗口'],['H18','截图·拖拽选区'],['H19','截图失败'],['H20','托盘菜单'],['H21','关于'],['H22','导入失败']
];
const NOTES = {
  H01:'从开始菜单启动且无图片。三个入口 + 拖放区。',H02:'文件拖到窗口上方：拖放区高亮为品牌橙，文案变为“松开以打开”。',
  H03:'导入解码中：旧内容保留（降透明），中央进度；状态栏 pill.busy。失败时恢复旧内容。',H04:'箭头工具；属性条显示颜色与粗细。',
  H05:'正在拖出矩形：实时轮廓 + 尺寸标签（由 Slint 叠加层绘制，松手后 Rust 合成）。',H06:'选中实心遮挡：双色选中框 + 8 手柄（命中区 16px）；属性条显示遮挡属性。',
  H07:'Shift 多选：多选外框；属性条显示数量与删除。',H08:'文字编辑：IME 组字期间所有单键快捷键暂停；候选窗跟随光标。',
  H09:'裁剪：外部变暗，三分线，属性条可输入尺寸。Enter 确认、Esc 取消。',H10:'复制中：主按钮内进度，标签不变宽；其他交付操作禁用。',
  H11:'复制成功：编辑窗口已关闭（U07），Toast 独立显示在桌面右下 3 秒。',H12:'复制失败：窗口与编辑保留，Toast 保持到用户处理。',
  H13:'保存成功：窗口保持，Toast 带“打开文件夹”。',H14:'保存失败：给出原因与“换个位置”；不留下半成品文件。',
  H15:'交付期间又修改：旧结果作废，提示重新复制。',H16:'关闭时存在未交付编辑。',H17:'截图覆盖层：悬停窗口自动吸附。',
  H18:'截图覆盖层：拖拽选区，放大镜显示坐标与十字准星。',H19:'截图失败（例如系统拒绝屏幕访问）。',H20:'托盘常驻（U05）：双击 = 截图。',
  H21:'关于对话框：包含 AboutSlint（Slint Royalty-free 2.0 许可条件）与本地处理声明。',H22:'导入失败：旧文档不变，Toast 说明原因。'
};
let size = 0, state = 'H06';

function pct(x,y,w,h){return `left:${x/IW*100}%;top:${y/IH*100}%;`+(w!=null?`width:${w/IW*100}%;height:${h/IH*100}%;`:'')}
function handles(){return [[0,0],[50,0],[100,0],[0,50],[100,50],[0,100],[50,100],[100,100]].map(([x,y])=>`<i style="left:${x}%;top:${y}%"></i>`).join('')}

function toolbar(st,w){
  const narrow = w < 900, tiny = w < 720;
  const tools = [['select','选择 V'],['arrow','箭头 A'],['rect','框 R'],['text','文字 T'],['num','序号 N'],['hl','高亮 H'],'|',['shield','遮挡 B'],['mosaic','马赛克 M'],'|',['crop','裁剪 C']];
  const active = {H04:'arrow',H05:'rect',H06:'shield',H07:'select',H08:'text',H09:'crop'}[st] || 'select';
  const busy = st==='H10';
  let h = `<div class="mark"><i></i>${tiny?'':'<span>ShareReady</span>'}</div>`;
  for (const t of tools){
    if (t==='|'){h+='<div class="vsep"></div>';continue}
    const on = t[0]===active, badge = t[0]==='mosaic' ? `<svg class="badge" viewBox="0 0 8 9"><path d="M4 0l4 1.5v3C8 7 6 8.5 4 9 2 8.5 0 7 0 4.5v-3z"/></svg>` : '';
    h += `<div class="ib${on?' on':''}" title="${t[1]}">${svg(t[0])}${badge}</div>`;
  }
  h += `<div class="grow"></div><div class="ib">${svg('undo')}</div><div class="ib dis">${svg('redo')}</div><div class="vsep"></div>`;
  h += tiny ? `<button class="btn icon${busy?' dis':''}" title="保存 Ctrl S">${svg('save')}</button>` : `<button class="btn${busy?' dis':''}">保存 ${narrow?'':'<span class="kc">Ctrl S</span>'}</button>`;
  h += busy ? `<button class="btn primary"><span class="spin"></span>复制</button>` : `<button class="btn primary">复制 ${tiny?'':'<span class="kc">Ctrl C</span>'}</button>`;
  return `<div class="toolbar">${h}</div>`;
}
function propbar(st){
  const color = (sel=0)=>`颜色 <span class="sws">${['--red','--yellow','--green','--blue','--white','--black'].map((c,i)=>`<span class="sw${c==='--white'?' w':''}${i===sel?' sel':''}" style="background:var(${c})"></span>`).join('')}</span>`;
  const weight = `粗细 <span class="seg"><span>细</span><span class="on">中</span><span>粗</span></span>`;
  let c;
  switch(st){
    case 'H04': case 'H05': case 'H10': case 'H11': case 'H12': case 'H13': case 'H14': case 'H15': case 'H16': case 'H22': c = color()+'<span class="vsep"></span>'+weight; break;
    case 'H06': c = `遮挡样式 <span class="seg"><span class="on">实心</span><span>安全马赛克</span></span> 颜色 <span class="sws"><span class="sw sel" style="background:var(--black)"></span><span class="sw w" style="background:#fff"></span></span><span class="vsep"></span>X <span class="num">516</span> Y <span class="num">143</span> W <span class="num focus">80</span> H <span class="num">20</span>|<button class="btn danger">删除 <span class="kc">Del</span></button>`; break;
    case 'H07': c = `<span style="color:var(--ink)">已选 3 个</span>|<button class="btn danger">删除 <span class="kc">Del</span></button>`; break;
    case 'H08': c = color()+`<span class="vsep"></span>字号 <span class="num">18</span><span class="seg"><span>无底色</span><span class="on">背景底色</span></span>`; break;
    case 'H09': c = `宽 <span class="num">560</span> 高 <span class="num">300</span><span class="seg"><span class="on">自由</span><span>锁定比例</span></span>|<button class="btn">取消 <span class="kc">Esc</span></button><button class="btn primary">确认 <span class="kc">Enter</span></button>`; break;
    default: return '';
  }
  const [head, tail] = c.split('|');
  return `<div class="propbar"><div class="pscroll">${head}</div>${tail?`<div class="tail">${tail}</div>`:''}</div>`;
}
function overlays(st){
  let o = '';
  const base = st!=='H03' || true;
  // existing objects
  o += `<div class="ov o-mosaic" style="${pct(374,143,102,20)}"></div><div class="ov o-dash" style="${pct(374,143,102,20)}"></div><div class="ov o-shield" style="${pct(374,143)}">${SHIELD_SMALL}</div>`;
  o += `<div class="ov o-solid" style="${pct(516,143,80,20)}"></div>`;
  if (st!=='H05'){ o += `<div class="ov o-rect" style="${pct(10,264,340,46)}"></div><div class="ov o-num" style="${pct(350,264)}">1</div>`; }
  o += `<svg class="ov" style="left:0;top:0;width:100%;height:100%;overflow:visible" viewBox="0 0 ${IW} ${IH}"><path d="M398 362L360 311" stroke="#e5342b" stroke-width="4" stroke-linecap="round"/><path d="M353.6 302.8L356 321.5 368.8 312z" fill="#e5342b"/></svg>`;
  if (st==='H08') o += `<div class="ov o-text o-textedit" style="${pct(404,352)}">这里看凭证<span class="caret"></span></div><div class="ime" style="${pct(404,382)}"><b>1.凭证</b>　2.平整　3.评正</div>`;
  else o += `<div class="ov o-text" style="${pct(404,352)}">这里看凭证</div>`;
  if (st==='H05') o += `<div class="ov o-draft" style="${pct(10,264,260,46)}"></div><span class="dimlabel" style="${pct(274,314)}">260 × 46</span>`;
  if (st==='H06') o += `<div class="ov o-sel" style="${pct(516,143,80,20)}">${handles()}</div>`;
  if (st==='H07') o += `<div class="ov o-multi" style="${pct(366,136,236,34)}"></div><div class="ov o-sel" style="${pct(10,264,340,46)}"></div>`;
  if (st==='H09') o += `<div class="crop-dark" style="${pct(0,0,620,40)}"></div><div class="crop-dark" style="${pct(0,340,620,90)}"></div><div class="crop-dark" style="${pct(0,40,30,300)}"></div><div class="crop-dark" style="${pct(590,40,30,300)}"></div><div class="crop-box" style="${pct(30,40,560,300)}">${handles()}</div>`;
  return o;
}
function toast(st){
  const T = {
    H11:`<span class="pill done">✓ 已复制</span><span><b>已复制到剪贴板</b><small><span class="mono">620 × 430</span> · 已遮挡 2 处</small></span>`,
    H12:`<span class="ic err">!</span><span><b>复制失败</b><small>剪贴板被其他程序占用</small></span><button class="btn small">重试</button>`,
    H13:`<span class="pill done">✓ 已保存</span><span><b>截图_1432.png</b><small>已保存到“图片”文件夹</small></span><button class="btn small">打开文件夹</button>`,
    H14:`<span class="ic err">!</span><span><b>保存失败</b><small>没有写入权限</small></span><button class="btn small">换个位置</button>`,
    H15:`<span class="ic warn">!</span><span><b>内容已变化</b><small>请重新复制</small></span><button class="btn small">复制</button>`,
    H19:`<span class="ic err">!</span><span><b>无法截图</b><small>系统拒绝访问屏幕</small></span><button class="btn small">重试</button>`,
    H22:`<span class="ic err">!</span><span><b>无法打开</b><small>格式不支持（仅 PNG / JPEG）</small></span>`
  };
  return T[st] ? `<div class="toast">${T[st]}</div>` : '';
}
function editor(st,w,h){
  const status = `<div class="status"><span class="mono">620 × 430</span><span class="pill secure">${SHIELD_SMALL.replace('currentColor','#1f8a65')}已遮挡 2 处</span>${st==='H03'?'<span class="pill busy">正在打开</span>':''}${st==='H10'?'<span class="pill busy">正在复制</span>':''}<span class="grow"></span><span class="zoom"><span class="z">适应 ${w<720?'':'<span class="kc">Ctrl 0</span>'}</span><span class="z on mono">100%</span><span class="z">−</span><span class="z">+</span></span></div>`;
  const pb = propbar(st);
  const chrome = 32+52+(pb?40:0)+30;
  const avail = [w-48, h-chrome-48];
  const k = Math.min(1, avail[0]/IW, avail[1]/IH);
  const shot = `<div class="shot" style="width:${IW*k}px;height:${IH*k}px;${st==='H03'?'opacity:.4':''}"><img src="${SHOT}" alt="合成聊天截图">${overlays(st)}</div>`;
  const zoomText = k<1 ? `适应 ${Math.round(k*100)}%` : '';
  const load = st==='H03' ? `<div class="loading"><div><span class="spin dark"></span>正在打开…</div></div>` : '';
  const dlg = st==='H16' ? `<div class="scrim"></div><div class="dialog"><h3>有未复制或保存的编辑</h3><p>关闭后这些编辑会丢失。</p><div class="acts"><button class="btn">取消 <span class="kc">Esc</span></button><button class="btn danger">放弃编辑</button><button class="btn primary">复制后关闭 <span class="kc">Enter</span></button></div></div>` : '';
  let s = status; if (zoomText) s = s.replace('<span class="z on mono">100%</span>',`<span class="z on mono">${Math.round(k*100)}%</span>`);
  return `<div class="win" style="width:${w}px;height:${h}px"><div class="titlebar"><span>截图 2026-10-19 14:32 — ShareReady</span><span>—　▢　✕</span></div>${toolbar(st,w)}${pb}<div class="canvas">${shot}${load}${toast(st)}</div>${s}${dlg}</div>`;
}
function emptyWin(st,w,h){
  const compact = w<720;
  return `<div class="win" style="width:${w}px;height:${h}px"><div class="titlebar"><span>ShareReady</span><span>—　▢　✕</span></div><div class="canvas"><div class="empty${compact?' compact':''}"><h2>开始一张截图</h2><div class="cards">
  <div class="card first"><svg viewBox="0 0 24 24"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/></svg>截图<span class="kc">Ctrl Shift A</span></div>
  <div class="card"><svg viewBox="0 0 24 24"><path d="M4 6h6l2 2h8v10H4z"/></svg>打开图片<span class="kc">Ctrl O</span></div>
  <div class="card"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="16" rx="2"/><path d="M9 4h6v3H9z"/></svg>粘贴<span class="kc">Ctrl V</span></div></div>
  <div class="drop${st==='H02'?' hover':''}">${st==='H02'?'松开以打开 · 订单截图.png':'或把 PNG / JPEG 拖到这里'}</div></div></div></div>`;
}
function desktop(st,w,h){
  const fw = Math.min(620, w*0.55), fh = fw*IH/IW;
  const fx = (w-fw)/2, fy = (h-40-fh-28)/2;
  let inner = `<div class="fakewin" style="left:${fx}px;top:${fy}px;width:${fw}px"><header>客服对话</header><img src="${SHOT}" alt=""></div>`;
  if (st==='H17'||st==='H18'){
    let cap = '';
    if (st==='H17'){
      cap = `<div class="cap"><div class="dim" style="left:0;top:0;right:0;bottom:0;background:rgba(38,37,30,.28)"></div><div class="snap" style="left:${fx}px;top:${fy}px;width:${fw}px;height:${fh+28}px"></div><span class="lab" style="left:${fx}px;top:${fy-24}px">${Math.round(fw)} × ${Math.round(fh+28)} · 客服对话</span><div class="hint">拖拽选区 <span class="kc">单击</span> 选窗口 <span class="kc">Enter</span> 全屏 <span class="kc">Esc</span> 取消</div></div>`;
    } else {
      const k=fw/620, sx=fx+318*k, sy=fy+28+128*k, sw=(608-318)*k, sh=(174-128)*k;
      cap = `<div class="cap"><div class="dim" style="left:0;top:0;right:0;height:${sy}px"></div><div class="dim" style="left:0;top:${sy+sh}px;right:0;bottom:0"></div><div class="dim" style="left:0;top:${sy}px;width:${sx}px;height:${sh}px"></div><div class="dim" style="left:${sx+sw}px;top:${sy}px;right:0;height:${sh}px"></div>
      <div class="selr" style="left:${sx}px;top:${sy}px;width:${sw}px;height:${sh}px">${handles()}</div><span class="lab" style="left:${sx}px;top:${sy-24}px">${Math.round(sw)} × ${Math.round(sh)}</span>
      <div class="mag" style="left:${Math.min(w-136,sx+sw+16)}px;top:${sy+sh+16}px"><span>x ${Math.round(sx+sw)}  y ${Math.round(sy+sh)}</span></div><div class="hint">松开完成选区 <span class="kc">Esc</span> 取消</div></div>`;
    }
    inner += cap;
  }
  if (st==='H11'||st==='H19') inner += toast(st).replace('class="toast"','class="toast" style="bottom:56px"');
  if (st==='H20') inner += `<div class="menu"><div class="hv"><span>截图</span><span class="kc">Ctrl Shift A</span></div><div><span>打开图片…</span></div><div><span>关于</span></div><hr><div><span>退出</span></div></div>`;
  inner += `<div class="taskbar"><span>中</span><span class="trayicon" title="ShareReady"></span><span class="mono">14:32</span></div>`;
  return `<div class="desk" style="width:${w}px;height:${h}px">${inner}</div>`;
}
function about(w,h){
  return `<div class="desk" style="width:${w}px;height:${h}px;background:var(--bg-workspace)"><div class="scrim"></div><div class="dialog about"><h3>关于 ShareReady（临时代号）</h3><p>图片只在本机处理，不上传、无账号、无遥测。</p>
  <dl><dt>版本</dt><dd class="mono">0.1.0</dd><dt>许可</dt><dd>MIT · 字体 OFL-1.1</dd><dt>界面</dt><dd>Slint 1.18.1（Royalty-free 2.0）</dd></dl>
  <div class="slint"><i></i><div><b style="color:var(--ink);font-weight:500">#MadeWithSlint</b><br><small style="color:var(--mute)">AboutSlint 组件位置（原生实现中渲染官方组件）</small></div></div>
  <div class="acts"><button class="btn primary">好 <span class="kc">Enter</span></button></div></div></div>`;
}
function render(){
  const [w,h] = SIZES[size];
  let html;
  if (state==='H01'||state==='H02') html = emptyWin(state,w,h);
  else if (['H11','H17','H18','H19','H20'].includes(state)) html = desktop(state,w,h);
  else if (state==='H21') html = about(w,h);
  else html = editor(state,w,h);
  const stage = document.getElementById('stage');
  stage.innerHTML = html;
  const wrap = document.getElementById('wrap');
  const k = Math.min(1, (wrap.clientWidth || w) / w);
  stage.style.transform = `scale(${k})`;
  wrap.style.height = (h*k)+'px';
  document.getElementById('note').innerHTML = `<b>${state} · ${STATES.find(s=>s[0]===state)[1]}</b> — ${NOTES[state]} <span class="mono">${w}×${h}</span>${k<1?` · 预览缩放 ${Math.round(k*100)}%`:''}`;
  document.querySelectorAll('#list button').forEach(b=>b.classList.toggle('on',b.dataset.id===state));
  document.querySelectorAll('#sizes button').forEach((b,i)=>b.classList.toggle('on',i===size));
  try { localStorage.setItem('sr-hifi', JSON.stringify({state,size})); } catch(e) {}
}
try { const s = JSON.parse(localStorage.getItem('sr-hifi')||'null'); if (s) { state = s.state || state; size = s.size ?? size; } } catch(e) {}
const q = new URLSearchParams(location.search); if (q.get('s')) state = q.get('s'); if (q.get('w')) size = +q.get('w');
document.getElementById('list').innerHTML = STATES.map(([id,n])=>`<button data-id="${id}"><span class="id">${id}</span>${n}</button>`).join('');
document.getElementById('sizes').innerHTML = SIZES.map(s=>`<button>${s[2]}</button>`).join('');
document.getElementById('list').onclick = e => { const b = e.target.closest('button'); if (b) { state = b.dataset.id; render(); } };
document.getElementById('sizes').onclick = e => { const b = e.target.closest('button'); if (b) { size = [...b.parentNode.children].indexOf(b); render(); } };
document.addEventListener('keydown', e => {
  const i = STATES.findIndex(s=>s[0]===state);
  if (e.key==='ArrowDown'||e.key==='j') { state = STATES[(i+1)%STATES.length][0]; render(); }
  if (e.key==='ArrowUp'||e.key==='k') { state = STATES[(i-1+STATES.length)%STATES.length][0]; render(); }
});
addEventListener('resize', render);
render();
</script>
</body>
</html>
