[package]
name = "shareready-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Deterministic scene rendering: pixel-replacing redactions, annotations and crop onto decoded source pixels."

[dependencies]
shareready-core = { path = "../shareready-core" }
image = { version = "=0.25.8", default-features = false, features = ["png"] }
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std"] } # no "simd": runtime CPU dispatch would make goldens machine-dependent
ab_glyph = { version = "=0.2.32", default-features = false, features = ["std"] }
