[package]
name = "shareready-native-input-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"

[dependencies]
egui = { version = "=0.36.2", default-features = false }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
raw-window-handle = "=0.6.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
