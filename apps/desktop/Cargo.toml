[package]
name = "anshot-desktop"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Anshot (安截) Windows desktop app: Slint UI over the Rust editor and image core."

# Own workspace and Cargo.lock: the frozen V1 WASM layer (e1-spike) pins
# wasm-bindgen =0.2.105, which conflicts with Slint's femtovg chain (=0.2.123).
# Merge into the root workspace once V1 is retired.
[workspace]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bin]]
name = "anshot"
path = "src/main.rs"

[dependencies]
anshot-core = { path = "../../crates/anshot-core" }
anshot-editor = { path = "../../crates/anshot-editor" }
anshot-platform-windows = { path = "../../crates/anshot-platform-windows" }
anshot-render = { path = "../../crates/anshot-render" }
slint = { version = "=1.18.1", features = ["unstable-winit-030", "unstable-fontique-011"] }
image = { version = "=0.25.8", default-features = false, features = ["png"] }
rfd = { version = "=0.15.4", default-features = false }
arboard = { version = "=3.6.1", default-features = false, features = ["image-data"] }

[build-dependencies]
slint-build = "=1.18.1"
