[workspace]
resolver = "2"
members = ["crates/anshot-core", "crates/anshot-editor", "crates/anshot-platform-windows", "crates/anshot-render", "e1-spike"]
default-members = ["crates/anshot-core", "crates/anshot-editor", "e1-spike"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
