name: Stage 01 S03 scripted browser redaction and actual-export pilot

on:
  push:
    branches: [docs/stage01-direction-skill-gates]
    paths: [.github/workflows/stage01-s03-scripted-pilot.yml]

permissions:
  contents: read

jobs:
  synthetic-real-competitors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout synthetic fixtures and research-only harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install isolated test dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          google-chrome --version
          python3 -m venv /tmp/share-ready-s03-pilot
          /tmp/share-ready-s03-pilot/bin/python -m pip install --disable-pip-version-check playwright==1.55.0 Pillow==12.3.0
      - name: Perform actual fixture import, manual oracle mask, download and inspect outputs
        shell: bash
        run: |
          set -euo pipefail
          /tmp/share-ready-s03-pilot/bin/python docs/research/s03_scripted_pilot.py
          test -s /tmp/shareready-s03-scripted-runs/results.json
      - name: Upload exact synthetic export binaries and traceable results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s03-real-competitor-scripted-exports
          path: /tmp/shareready-s03-scripted-runs/
          if-no-files-found: error
          retention-days: 30
