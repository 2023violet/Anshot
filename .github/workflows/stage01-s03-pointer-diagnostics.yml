name: Stage01 S03 forensic repeated-manual-mask diagnostics
on:
  push:
    branches: [docs/stage01-direction-skill-gates]
    paths: [.github/workflows/stage01-s03-pointer-diagnostics.yml]
permissions:
  contents: read
jobs:
  inspect-input:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Install isolated browser tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/sr-pointer
          /tmp/sr-pointer/bin/python -m pip install --disable-pip-version-check playwright==1.55.0
          google-chrome --version
      - name: Repeat gestures in three different orders; collect DOM targets and resulting exports
        shell: bash
        run: |
          set -euo pipefail
          /tmp/sr-pointer/bin/python docs/research/s03_pointer_diagnostics.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s03-pointer-order-dom-diagnostics
          path: /tmp/s03-pointer-diagnostic/
          if-no-files-found: error
          retention-days: 30
