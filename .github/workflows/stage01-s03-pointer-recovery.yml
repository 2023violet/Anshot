name: Stage 01 S03 pointer capture recovery experiments

on:
  push:
    branches:
      - docs/stage01-direction-skill-gates
    paths:
      - .github/workflows/stage01-s03-pointer-recovery.yml

permissions:
  contents: read

jobs:
  pointer-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - name: Checkout synthetic fixtures
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install isolated research dependencies
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version
          python3 -m venv /tmp/share-ready-recovery
          /tmp/share-ready-recovery/bin/python -m pip install --disable-pip-version-check playwright==1.55.0 Pillow==12.3.0
      - name: Exercise eight clean synthetic scenarios and inspect actual PNG exports
        shell: bash
        run: |
          set -euo pipefail
          /tmp/share-ready-recovery/bin/python docs/research/s03_pointer_recovery.py
          test -s /tmp/share-ready-s03-pointer-recovery/summary.json
      - name: Archive evidence and failure scenarios without modifying main
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s03-pointer-recovery-8-variants
          path: /tmp/share-ready-s03-pointer-recovery/
          if-no-files-found: error
          retention-days: 30
