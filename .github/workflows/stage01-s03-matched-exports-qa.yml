name: Stage 01 S03 verify matched competitor exports after reset

on:
  push:
    branches: [docs/stage01-direction-skill-gates]
    paths: [.github/workflows/stage01-s03-inspect-exports.yml]

permissions:
  contents: read
  actions: read

jobs:
  review-outputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research truth, not product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download exact previous competitor-generated files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/s03-matched-exports
          gh run download 38688552378 --repo 2023violet/ShareReady --name s03-matched-real-exports-with-neutral-reset --dir /tmp/s03-matched-exports
          ls -lh /tmp/s03-matched-exports/
          test -s /tmp/s03-matched-exports/results.json
      - name: Independently reopen matched PNG exports and render source overlays
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/s03-output-qa
          /tmp/s03-output-qa/bin/python -m pip install --disable-pip-version-check Pillow==12.3.0
          /tmp/s03-output-qa/bin/python - <<'PY'
          import base64,json
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont,ImageChops
          root=Path("/tmp/s03-matched-exports")
          entries=json.loads((root/"results.json").read_text(encoding="utf8"))["results"]
          truth={f["id"]:f for f in json.loads(Path("docs/research/fixtures/manifest.json").read_text(encoding="utf8"))["fixtures"]}
          canvas=Image.new("RGB",(1270,1000),"#e8edf2")
          painter=ImageDraw.Draw(canvas)
          font=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",18)
          order=[("Redacted","T01_CHAT"),("Redaction Tools","T01_CHAT"),("Redacted","T02_ORDER"),("Redaction Tools","T02_ORDER")]
          for i,(tool,task) in enumerate(order):
              entry=next(e for e in entries if e["tool"]==tool and e["task_id"]==task)
              assert entry["status"]=="REAL_UI_DOWNLOAD_COMPLETE_NEEDS_OUTPUT_REVIEW",entry
              output=root/(tool.replace(" ","_").lower()+"_"+task+"_export.png")
              assert output.exists(),output
              img=Image.open(output).convert("RGB")
              assert img.size==(truth[task]["width"],truth[task]["height"])
              # Red outlines = regions unchanged at its center (diagnostic, not false software claim).
              draw=ImageDraw.Draw(img)
              misses=[r["id"] for r in entry["region_analysis"] if not r["changed_some_pixels"]]
              assert len(misses)==0, ("UNEXPECTED_UNCHANGED_TARGET",tool,task,misses)
              assert all(r["unchanged"] for r in entry["preservation_analysis"]), ("KEEP_CONTENT_CHANGED",tool,task)
              assert entry["export_exif_present"] is False, ("EXPORT_EXIF_STILL_PRESENT",tool,task)
              if tool=="Redaction Tools":
                  required_manual=3 if task=="T01_CHAT" else 2
                  assert entry["neutral_reset_clicks"]==required_manual-1
                  assert entry["mask_addition_trace"][-1]["manual_overlays"]==required_manual
              for reg in truth[task]["sensitive_regions"]:
                  b=reg["rect_px"]
                  col="#df2e2e" if reg["id"] in misses else "#30854f"
                  draw.rectangle((b[0],b[1],b[2]-1,b[3]-1),outline=col,width=4)
              img.thumbnail((610,400))
              col=i%2;row=i//2
              x=16+col*625;y=15+row*490
              painter.rectangle((x-4,y-3,x+610,y+452),fill="#ffffff",outline="#b5bfcf",width=2)
              painter.text((x,y),tool+" | "+task+" | unchanged target regions: "+str(len(misses)),fill="#253041",font=font)
              canvas.paste(img,(x,y+30))
              painter.text((x,y+429),"red = unchanged; green = changed",fill="#354353",font=font)
              print("EXPORT_VERIFIED",tool,task,"changed",len(truth[task]["sensitive_regions"])-len(misses),
                    "unchanged",misses)
          final=Path("/tmp/s03_matched_exports_contact_sheet.jpg")
          canvas.save(final,format="JPEG",quality=57,optimize=True)
          payload=base64.b64encode(final.read_bytes()).decode("ascii")
          print("S03_EXPORT_CONTACT_SHEET_BASE64_BEGIN")
          for start in range(0,len(payload),1000):print(payload[start:start+1000])
          print("S03_EXPORT_CONTACT_SHEET_BASE64_END")
          print("VISUAL_QA_NOTE: red regions may reflect automation errors; output files are real, marked sheet is only diagnostic")
          PY
      - name: Preserve visual audit figure (not a product design asset)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s03-matched-output-audit-contact-sheet
          path: /tmp/s03_matched_exports_contact_sheet.jpg
          if-no-files-found: error
          retention-days: 30
