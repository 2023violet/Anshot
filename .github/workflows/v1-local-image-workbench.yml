name: ShareReady V1 local editor (Rust WASM Chrome and package)

on:
  push:
    branches: [feature/v1-local-image-workbench]
    paths:
      - .github/workflows/v1-local-image-workbench.yml
      - e1-spike/**
      - web-app/**

permissions:
  contents: read

jobs:
  v1-rust-wasm-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current product branch without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate source and input tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = feature/v1-local-image-workbench
          echo "PRODUCT_HEAD=$(git rev-parse HEAD)"
          node --check web-app/app.js
          python3 -m py_compile web-app/tests/test_local_app.py
          test -s e1-spike/Cargo.lock
      - name: Build and test Rust codec and product preview
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo fetch --manifest-path e1-spike/Cargo.toml --locked
          cargo test --manifest-path e1-spike/Cargo.toml --locked --offline
          cargo test --manifest-path e1-spike/Cargo.toml --locked --offline --test codec_security
          git diff --exit-code -- e1-spike/Cargo.lock
      - name: Compile exact Rust WASM source for local editor
        shell: bash
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          cargo build --manifest-path e1-spike/Cargo.toml --locked --offline --release --target wasm32-unknown-unknown --features web
          cargo install wasm-bindgen-cli --version 0.2.105 --locked
          mkdir -p web-app/pkg
          wasm-bindgen --target web --out-name shareready_e1 --out-dir web-app/pkg e1-spike/target/wasm32-unknown-unknown/release/shareready_e1.wasm
          test -s web-app/pkg/shareready_e1.js
          test -s web-app/pkg/shareready_e1_bg.wasm
          sha256sum web-app/pkg/shareready_e1_bg.wasm
      - name: Run actual Chrome local-image editor tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/shareready-v1-tests
          /tmp/shareready-v1-tests/bin/python -m pip install --disable-pip-version-check Pillow==12.3.0 playwright==1.55.0
          google-chrome --version
          /tmp/shareready-v1-tests/bin/python web-app/tests/test_local_app.py
          test -s /tmp/shareready-v1-browser/v1-results.json
          echo "SHAREREADY_V1_LOCAL_IMAGE_EDITOR_END_TO_END_PASS"
      - name: Package runnable local static editor
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shareready-dist/ShareReady-V1/pkg
          cp web-app/index.html web-app/app.js web-app/README.md /tmp/shareready-dist/ShareReady-V1/
          cp web-app/pkg/shareready_e1.js web-app/pkg/shareready_e1_bg.wasm /tmp/shareready-dist/ShareReady-V1/pkg/
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/shareready-dist/ShareReady-V1/COMMIT.txt
          cd /tmp/shareready-dist
          zip -qr /tmp/ShareReady-V1-local-workbench.zip ShareReady-V1
          sha256sum /tmp/ShareReady-V1-local-workbench.zip
      - name: Upload runnable editor and real Chrome evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shareready-v1-local-app-and-chrome-evidence
          path: |
            /tmp/ShareReady-V1-local-workbench.zip
            /tmp/shareready-v1-browser/
          if-no-files-found: warn
          retention-days: 30
