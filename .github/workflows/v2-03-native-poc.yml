name: SR-V2-03 Rust native Windows egui feasibility
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v2-03-native-poc.yml
      - poc/native-egui/**
      - crates/anshot-core/**
      - crates/anshot-editor/**
      - crates/anshot-platform-windows/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-egui-poc:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Resolve isolated Cargo dependency lock
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          Write-Host "SR_V2_03_SOURCE_SHA=$env:GITHUB_SHA"
          cargo --version
          rustc --version
          if (-not (Test-Path poc/native-egui/Cargo.lock)) {throw "Pinned Cargo.lock missing"}
          cargo fetch --manifest-path poc/native-egui/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) {throw "Strict locked Cargo fetch failed"}
          Write-Host "SR_V2_03_WGPU_LOCKED_FETCH_PASS"
      - name: Build and test real Windows Rust native executable
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          cargo test -p anshot-platform-windows --locked
          if ($LASTEXITCODE -ne 0) {throw "Windows platform tests failed"}
          cargo test --manifest-path poc/native-egui/Cargo.toml --workspace --locked
          if ($LASTEXITCODE -ne 0) {throw "Rust tests failed"}
          cargo build --manifest-path poc/native-egui/Cargo.toml --locked --release
          if ($LASTEXITCODE -ne 0) {throw "Native GUI build failed"}
          $exe="poc/native-egui/target/release/shareready-native-egui-poc.exe"
          if (-not (Test-Path $exe)) {throw "Missing EXE"}
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) {throw "Core/Editor executable self-test failed"}
          Get-FileHash $exe -Algorithm SHA256
          git diff --exit-code -- poc/native-egui/Cargo.lock
          if ($LASTEXITCODE -ne 0) {throw "Cargo.lock drift after strict build"}
          Write-Host "SR_V2_03_WINDOWS_COMPILE_AND_DOMAIN_TEST_PASS"
      - name: Windows graphics driver metadata and three renderer probes
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference="Stop"
          & pwsh -NoProfile -File "poc/native-egui/Run-Renderer-Probes.ps1" -OutputDir "poc/native-egui/evidence"
          if ($LASTEXITCODE -ne 0) { throw "Renderer matrix 0/3 or probe error; see uploaded JSON and streams" }
      - name: Upload native POC unsigned executable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shareready-v2-03-egui-windows-poc
          path: |
            poc/native-egui/target/release/shareready-native-egui-poc.exe
            poc/native-egui/Cargo.lock
            poc/native-egui/evidence/**
          if-no-files-found: warn
          retention-days: 14
