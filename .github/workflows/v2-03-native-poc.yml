name: SR-V2-03 Rust native Windows egui feasibility
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v2-03-native-poc.yml
      - poc/native-egui/**
      - crates/shareready-core/**
      - crates/shareready-editor/**
  workflow_dispatch:

permissions:
  contents: write # temporary, solely for one-time wgpu lock regeneration; reverted after pin

jobs:
  windows-egui-poc:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Resolve isolated Cargo dependency lock
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          Write-Host "SR_V2_03_SOURCE_SHA=$env:GITHUB_SHA"
          cargo --version
          rustc --version
          # The feature addition needs exactly one Cargo.lock refresh.
          # Once the lock is pinned this step becomes strict-only.
          cargo generate-lockfile --manifest-path poc/native-egui/Cargo.toml
          if ($LASTEXITCODE -ne 0) {throw "Cargo lock bootstrap failed"}
          cargo fetch --manifest-path poc/native-egui/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) {throw "Locked Cargo fetch failed"}
          Write-Host "SR_V2_03_LOCK_BOOTSTRAPPED_FOR_WGPU"
      - name: Build and test real Windows Rust native executable
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          cargo test --manifest-path poc/native-egui/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) {throw "Rust tests failed"}
          cargo build --manifest-path poc/native-egui/Cargo.toml --locked --release
          if ($LASTEXITCODE -ne 0) {throw "Native GUI build failed"}
          $exe="poc/native-egui/target/release/shareready-native-egui-poc.exe"
          if (-not (Test-Path $exe)) {throw "Missing EXE"}
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) {throw "Core/Editor executable self-test failed"}
          Get-FileHash $exe -Algorithm SHA256
          Write-Host "SR_V2_03_WINDOWS_COMPILE_AND_DOMAIN_TEST_PASS"
      - name: Windows graphics driver metadata and three renderer probes
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference="Stop"
          & "poc/native-egui/Run-Renderer-Probes.ps1" -OutputDir "poc/native-egui/evidence"
          if ($LASTEXITCODE -ne 0) { throw "No GUI renderer successfully reached window lifecycle (consult artifact)" }
      - name: Pin updated isolated wgpu dependency lock on unchanged main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference="Stop"
          $lock="poc/native-egui/Cargo.lock"
          $latest=(gh api "repos/$env:GITHUB_REPOSITORY/branches/main" --jq ".commit.sha").Trim()
          if ($LASTEXITCODE -ne 0 -or $latest -ne $env:GITHUB_SHA) {throw "Main changed; refuse automatic lock update"}
          $existing=gh api "repos/$env:GITHUB_REPOSITORY/contents/$lock" --jq ".sha"
          if ($LASTEXITCODE -ne 0) {throw "Cannot read original lock blob"}
          $content=[Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path $lock)))
          $body=@{message="build(v2-03): pin wgpu/DX12 egui POC Cargo.lock";content=$content;sha=$existing.Trim();branch="main"} | ConvertTo-Json -Compress
          $request=Join-Path $env:RUNNER_TEMP "dx12-lock-put.json"
          [IO.File]::WriteAllText($request,$body,[Text.UTF8Encoding]::new($false))
          gh api -X PUT "repos/$env:GITHUB_REPOSITORY/contents/$lock" --input $request
          if ($LASTEXITCODE -ne 0) {throw "Pin updated lock failed"}
          Write-Host "SR_V2_03_WGPU_LOCK_PINNED_FOLLOWUP_CI_REQUIRED"
      - name: Upload native POC unsigned executable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shareready-v2-03-egui-windows-poc
          path: |
            poc/native-egui/target/release/shareready-native-egui-poc.exe
            poc/native-egui/Cargo.lock
            poc/native-egui/evidence/**
          if-no-files-found: warn
          retention-days: 14
