name: E2 source-matched Chromium smoke (no reused WASM)

on:
  push:
    branches: [feature/e2-workbench-integration]
    paths:
      - .github/workflows/e2-workbench-fast-browser.yml
      - e2-workbench/**
      - e1-spike/src/lib.rs
      - e1-spike/Cargo.toml
      - e1-spike/Cargo.lock

permissions:
  contents: read

jobs:
  source-matched-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact commit without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify scope and source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = feature/e2-workbench-integration
          test -s e1-spike/Cargo.lock
          node --check e2-workbench/app.js
          python3 -m py_compile e2-workbench/tests/verify_e2_browser.py e2-workbench/tests/verify_e2_precision_browser.py
          sha256sum e1-spike/src/lib.rs e1-spike/Cargo.lock e2-workbench/app.js
      - name: Build matching Rust WASM instead of restoring old artifact
        shell: bash
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          cargo fetch --manifest-path e1-spike/Cargo.toml --locked
          cargo build --manifest-path e1-spike/Cargo.toml --locked --offline --release --target wasm32-unknown-unknown --features web
          cargo install wasm-bindgen-cli --version 0.2.105 --locked
          mkdir -p e1-spike/web/pkg
          wasm-bindgen --target web --out-name shareready_e1 --out-dir e1-spike/web/pkg e1-spike/target/wasm32-unknown-unknown/release/shareready_e1.wasm
          test -s e1-spike/web/pkg/shareready_e1_bg.wasm
          sha256sum e1-spike/web/pkg/shareready_e1_bg.wasm
      - name: Real Chromium synthetic smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/e2-quick
          /tmp/e2-quick/bin/python -m pip install --disable-pip-version-check Pillow==12.3.0 playwright==1.55.0
          /tmp/e2-quick/bin/python e2-workbench/tests/verify_e2_browser.py
          /tmp/e2-quick/bin/python e2-workbench/tests/verify_e2_precision_browser.py
          echo "E2_SOURCE_MATCHED_BROWSER_SMOKE_PASS"
      - name: Preserve real synthetic PNG and WASM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2-source-matched-chromium-smoke-evidence
          path: |
            /tmp/e2-browser-evidence/
            e1-spike/web/pkg/
          retention-days: 30
          if-no-files-found: warn
